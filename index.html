<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>股票辅助计算器</title>
  
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="股票计算器">
  
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- 头部导航 -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-10 px-4 py-3 flex justify-between items-center shadow-md">
    <h1 class="text-lg font-bold tracking-wide text-blue-400">📈 股票计算助手</h1>
    <span class="text-xs text-slate-400 bg-slate-700/50 px-2 py-1 rounded">PWA 极速版</span>
  </header>

  <!-- 动态 Tab 导航栏 -->
  <nav class="bg-slate-800/80 backdrop-blur border-b border-slate-700 flex justify-around text-sm font-medium">
    <button id="btn-tab-change" data-tab="tab-change" class="tab-btn py-3 px-4 flex-1 text-center border-b-2 border-blue-500 text-blue-400 transition-colors">
      涨跌幅计算
    </button>
    <button id="btn-tab-trade" data-tab="tab-trade" class="tab-btn py-3 px-4 flex-1 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors">
      做T / 摊薄成本
    </button>
  </nav>

  <!-- 内容区域 -->
  <main class="flex-1 p-4 max-w-lg w-full mx-auto space-y-4">

    <!-- 功能 1：涨跌幅计算器 -->
    <section id="tab-change" class="tab-panel space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm space-y-3">
        <h2 class="text-base font-semibold text-slate-200">目标价格与涨跌幅</h2>
        <div>
          <label class="block text-xs text-slate-400 mb-1">基准价格 (元)</label>
          <input type="number" id="change-base" placeholder="如：10.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">目标价格 (元)</label>
            <input type="number" id="change-target" placeholder="如：11.50" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">目标百分比 (%)</label>
            <input type="number" id="change-percent" placeholder="如：10" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>
      </div>

      <div class="grid grid-cols-4 gap-2">
        <button data-pct="10" class="pct-btn bg-red-500/20 text-red-400 border border-red-500/30 py-2 rounded-lg text-xs font-semibold hover:bg-red-500/30">+10% (主板)</button>
        <button data-pct="20" class="pct-btn bg-red-500/20 text-red-400 border border-red-500/30 py-2 rounded-lg text-xs font-semibold hover:bg-red-500/30">+20% (创业板)</button>
        <button data-pct="-10" class="pct-btn bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 py-2 rounded-lg text-xs font-semibold hover:bg-emerald-500/30">-10% (跌停)</button>
        <button data-pct="-20" class="pct-btn bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 py-2 rounded-lg text-xs font-semibold hover:bg-emerald-500/30">-20% (跌停)</button>
      </div>

      <div id="change-result" class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 hidden">
        <div class="text-xs text-slate-400 mb-1">计算结果</div>
        <div id="change-result-val" class="text-2xl font-bold">--</div>
      </div>
    </section>

    <!-- 功能 2：做 T / 摊薄成本计算器 -->
    <section id="tab-trade" class="tab-panel space-y-4 hidden">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm space-y-3">
        <h2 class="text-base font-semibold text-slate-200">1. 当前持仓</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">持仓单价 (元)</label>
            <input type="number" id="hold-cost" placeholder="如：15.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">持仓数量 (股)</label>
            <input type="number" id="hold-amount" placeholder="如：1000" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>
      </div>

      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm space-y-3">
        <div class="flex justify-between items-center mb-1">
          <h2 class="text-base font-semibold text-slate-200">2. 新增交易</h2>
          <div class="flex bg-slate-900 rounded-lg p-1 border border-slate-700 text-xs">
            <button id="trade-type-buy" class="px-3 py-1 rounded-md bg-blue-600 text-white font-medium">买入 / 补仓</button>
            <button id="trade-type-sell" class="px-3 py-1 rounded-md text-slate-400 font-medium">卖出 / 减仓</button>
          </div>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">交易单价 (元)</label>
            <input type="number" id="trade-price" placeholder="如：12.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">交易数量 (股)</label>
            <input type="number" id="trade-amount" placeholder="如：500" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>
      </div>

      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm space-y-3">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">交易后最新状态</h2>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <div class="text-xs text-slate-400">最新成本价</div>
            <div id="res-new-cost" class="text-xl font-bold text-white mt-0.5">--</div>
          </div>
          <div>
            <div class="text-xs text-slate-400">最新总持仓</div>
            <div id="res-new-amount" class="text-xl font-bold text-white mt-0.5">--</div>
          </div>
          <div>
            <div class="text-xs text-slate-400">本次变动资金</div>
            <div id="res-trade-cash" class="text-base font-semibold text-slate-300 mt-0.5">--</div>
          </div>
          <div>
            <div class="text-xs text-slate-400">成本变动幅度</div>
            <div id="res-cost-diff" class="text-base font-semibold text-slate-300 mt-0.5">--</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
