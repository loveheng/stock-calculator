# Docker 镜像自动构建：推送到 GitHub 后自动构建并发布到 GitHub Container Registry。
# 镜像地址：ghcr.io/loveheng/stock-calculator（GITHUB_TOKEN 自动鉴权，无需配置 secrets）
#
# 触发条件：
#   - push 到 main 分支        → 镜像 tag：latest、main、sha-xxxxxxx
#   - push 到 dev 分支         → 镜像 tag：dev、sha-xxxxxxx
#   - push tag（如 v1.0.0）    → 镜像 tag：1.0.0、sha-xxxxxxx
#   - Actions 页面手动触发
#
# 首次发布后，可在 GitHub 仓库 → Packages → stock-calculator 中将可见性改为 Public，
# 之后即可免登录拉取：docker pull ghcr.io/loveheng/stock-calculator:latest

name: docker-image

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

# 同分支新推送自动取消旧构建，节省 CI 时长
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # 国内本地构建默认走 Dockerfile 里的腾讯镜像源；
      # GitHub Actions 的 runner 在海外，显式改用 npmjs 官方源更快更稳
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 如需同时构建 arm64（树莓派 / Apple Silicon / ARM NAS）：
      #   1) 在 Set up Docker Buildx 之前加一步：
      #      uses: docker/setup-qemu-action@v3
      #   2) platforms 改为：linux/amd64,linux/arm64
      #   （arm64 走 QEMU 模拟，npm ci 阶段会明显变慢）
